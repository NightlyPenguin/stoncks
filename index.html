<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15171A;
    --surface:#1C1F22;
    --surface-2:#23262A;
    --border:#31353A;
    --border-soft:#2A2D31;
    --text:#ECEDEE;
    --text-muted:#9AA0A6;
    --text-faint:#5E6469;
    --accent:#F2C14E;
    --accent-soft:#3A331E;
    --success:#7CB88F;
    --success-soft:#1E2A22;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:920px;margin:0 auto;padding:0 0 60px;}

  /* Header */
  header{
    padding:24px 20px 16px;
    border-bottom:1px solid var(--border);
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 16px;
    letter-spacing:.01em;
  }
  .control-row{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .field{display:flex;align-items:center;gap:8px;}
  .field label{font-size:12px;color:var(--text-muted);}
  input[type=date], input[type=number]{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    padding:6px 10px;
    border-radius:3px;
  }
  input[type=number]{width:56px;}
  button.ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-muted);
    font-size:12px;
    padding:6px 12px;
    border-radius:3px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  button.ghost:hover{border-color:var(--text-muted);color:var(--text);}
  .progress-badge{
    margin-left:auto;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-muted);
    border:1px solid var(--border-soft);
    padding:5px 10px;
    border-radius:3px;
  }
  .progress-badge.full{color:var(--success);border-color:var(--success-soft);}
  .block-tag{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--accent);
    background:var(--accent-soft);
    padding:4px 9px;
    border-radius:3px;
  }

  /* Tabs */
  nav#dayTabs{
    display:flex;
    overflow-x:auto;
    border-bottom:1px solid var(--border);
    background:var(--surface);
  }
  .tab{
    flex:0 0 auto;
    padding:14px 18px 12px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:500;
    color:var(--text-muted);
    white-space:nowrap;
  }
  .tab .sub{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:10px;
    font-weight:400;
    color:var(--text-faint);
    margin-top:2px;
  }
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab.rest{opacity:.55;}

  main#dayContent{padding:20px;}

  .day-heading{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:18px;
  }
  .day-heading h2{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:20px;
    margin:0;
  }
  .day-heading .focus{
    font-size:12px;
    color:var(--text-muted);
  }

  .rest-message{
    text-align:center;
    padding:60px 20px;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:15px;
    letter-spacing:.03em;
    border:1px dashed var(--border);
  }

  /* Exercise row */
  .exercise{
    border-top:1px solid var(--border-soft);
    padding:16px 0;
  }
  .exercise:last-child{border-bottom:1px solid var(--border-soft);}
  .ex-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    cursor:pointer;
  }
  .ex-name{
    font-size:15px;
    font-weight:600;
    margin:0 0 3px;
  }
  .ex-target{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-muted);
  }
  .ex-target .rpe{color:var(--accent);}
  .ex-toggle{
    font-size:11px;
    color:var(--text-faint);
    white-space:nowrap;
    padding-top:3px;
  }

  .ex-details{
    display:none;
    margin-top:12px;
    padding:12px 14px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:3px;
    font-size:12.5px;
    color:var(--text-muted);
    line-height:1.55;
  }
  .ex-details.open{display:block;}
  .ex-details .row{margin-bottom:6px;}
  .ex-details .row:last-child{margin-bottom:0;}
  .ex-details b{color:var(--text);font-weight:600;}

  .sets{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .set-row{
    display:grid;
    grid-template-columns:56px 1fr 1fr 90px;
    gap:8px;
    align-items:center;
  }
  .set-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
  }
  .set-row input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    padding:7px 8px;
    border-radius:3px;
  }
  .set-row input::placeholder{color:var(--text-faint);}
  .set-row input:focus{outline:none;border-color:var(--accent);}
  .set-row input.logged{border-color:var(--success-soft);background:var(--success-soft);}
  .set-hint{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
    text-align:right;
  }
  .set-hint .up{color:var(--success);}

  .field-labels{
    display:grid;
    grid-template-columns:56px 1fr 1fr 90px;
    gap:8px;
    margin-bottom:2px;
  }
  .field-labels span{
    font-size:10px;
    color:var(--text-faint);
  }

  .variant-label{
    font-size:10px;
    color:var(--text-faint);
    margin:12px 0 6px;
  }
  .variant-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:4px;
  }
  .variant-chip{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-muted);
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    padding:6px 11px;
    border-radius:14px;
    cursor:pointer;
    line-height:1.3;
  }
  .variant-chip:hover{color:var(--text);}
  .variant-chip.active{
    border-color:var(--accent);
    color:var(--accent);
    background:var(--accent-soft);
  }
  .sub-flag{
    color:var(--text-faint);
    font-weight:400;
    font-size:11px;
  }

  .add-set-btn{
    margin-top:10px;
    background:transparent;
    border:1px dashed var(--border);
    color:var(--text-muted);
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:6px 12px;
    border-radius:3px;
    cursor:pointer;
  }
  .add-set-btn:hover{border-color:var(--accent);color:var(--accent);}
  .remove-set-btn{
    background:transparent;
    border:none;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;
    font-size:11px;
    text-decoration:underline;
    cursor:pointer;
    text-align:right;
    padding:0;
  }
  .remove-set-btn:hover{color:var(--text-muted);}

  /* History view */
  #historyView{padding:20px;}
  .history-controls{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  select{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:6px 10px;
    border-radius:3px;
  }
  .history-empty{
    color:var(--text-faint);
    font-size:13px;
    padding:30px 0;
    text-align:center;
  }
  .history-group-title{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--text);
    margin:26px 0 12px;
  }
  .history-group-title:first-child{margin-top:0;}
  .history-chart{
    width:100%;
    overflow-x:auto;
    margin-bottom:22px;
  }
  .history-chart svg{display:block;}
  .history-chart .line{fill:none;stroke:var(--accent);stroke-width:2;}
  .history-chart .point{fill:var(--accent);}
  .history-chart .axis-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    fill:var(--text-faint);
  }
  .history-chart .value-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    fill:var(--text-muted);
  }
  table.history-table{
    width:100%;
    border-collapse:collapse;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
  }
  table.history-table th, table.history-table td{
    border-bottom:1px solid var(--border-soft);
    padding:7px 10px;
    text-align:left;
    white-space:nowrap;
  }
  table.history-table th{
    color:var(--text-faint);
    font-weight:500;
    font-size:10.5px;
    font-family:'Inter',sans-serif;
  }
  table.history-table td.variant-note{
    color:var(--text-faint);
    font-family:'Inter',sans-serif;
    font-size:11px;
  }

  @media (max-width:520px){
    h1{font-size:22px;}
    .set-row{grid-template-columns:40px 1fr 1fr 70px;}
    .field-labels{grid-template-columns:40px 1fr 1fr 70px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Training Log</h1>
    <div class="control-row">
      <div class="field">
        <label for="weekInput">Week</label>
        <input type="number" id="weekInput" min="1" max="12" value="1">
      </div>
      <span class="block-tag" id="blockTag">Block A · Weeks 1-5</span>
      <div class="field">
        <label for="dateInput">Session date</label>
        <input type="date" id="dateInput">
      </div>
      <button class="ghost" id="todayBtn">Today</button>
      <button class="ghost" id="historyToggleBtn">History</button>
    </div>
    <div class="control-row">
      <span class="progress-badge" id="progressBadge">0 / 0 logged</span>
    </div>
  </header>

  <nav id="dayTabs"></nav>
  <main id="dayContent"></main>

  <section id="historyView" style="display:none;">
    <div class="history-controls">
      <div class="field">
        <label for="histBlockSelect">Block</label>
        <select id="histBlockSelect"></select>
      </div>
      <div class="field">
        <label for="histDaySelect">Day</label>
        <select id="histDaySelect"></select>
      </div>
      <div class="field">
        <label for="histExerciseSelect">Exercise</label>
        <select id="histExerciseSelect"></select>
      </div>
    </div>
    <div id="historyContent"></div>
  </section>
</div>

<script>
const BLOCKS = [
  {
    id:'A', label:'Weeks 1-5',
    days:[
      {id:'upper', name:'Upper', focus:'Strength focus', rest:false, exercises:[
        {n:'45° Incline Barbell Press', t:'Failure', w:'2-3', s:3, r:'6-8', e:'~8-9', l:'10', rest:'3-5 min', s1:'45° Incline DB Press', s2:'45° Incline Machine Press', note:'1 second pause at the bottom of each rep while maintaining tension on the pecs.'},
        {n:'Cable Crossover Ladder', t:'Failure', w:'1-2', s:2, r:'8-10', e:'~8-9', l:'10', rest:'1-2 min', s1:'Pec Deck', s2:'Bottom-Half DB Flye', note:'Do one set with low cable position, one with medium, one with high. If you only have one or two sets, choose the position(s) you prefer.'},
        {n:'Wide-Grip Pull-Up', t:'Failure', w:'1-2', s:3, r:'8-10', e:'~8-9', l:'10', rest:'2-3 min', s1:'Wide-Grip Lat Pulldown', s2:'Dual-Handle Lat Pulldown', note:'1.5x shoulder width overhand grip. Slow 2-3 second negative. Feel your lats pulling apart on the way down.'},
        {n:'High-Cable Lateral Raise', t:'Failure', w:'1-2', s:2, r:'8-10', e:'~8-9', l:'10', rest:'1-2 min', s1:'High-Cable Cuffed Lateral Raise', s2:'Lean-In DB Lateral Raise', note:'Focus on squeezing your lateral delt to move the weight.'},
        {n:'Pendlay Deficit Row', t:'Failure + LLPs (Extend set)', w:'1-2', s:2, r:'6-8', e:'~8-9', l:'10', rest:'2-3 min', s1:'Smith Machine Row', s2:'Single-Arm DB Row', note:'Stand on a bumper plate. Focus on getting a big stretch and touch your stomach/chest on each rep!'},
        {n:'Overhead Cable Triceps Extension (Bar)', t:'Failure', w:'1', s:2, r:'8-10', e:'~8-9', l:'10', rest:'1-2 min', s1:'Overhead Cable Triceps Extension (Rope)', s2:'DB Skull Crusher', note:'Optionally pause for 0.5-1 second at the stretched aspect of each rep.'},
        {n:'Bayesian Cable Curl', t:'Failure', w:'1', s:2, r:'8-10', e:'~8-9', l:'10', rest:'1-2 min', s1:'Seated Super-Bayesian High Cable Curl', s2:'Incline DB Stretch Curl', note:'If you have a left-right bicep size imbalance, do these 1 arm at a time, starting with the weaker arm. Then match the reps and RPE on the weaker arm before doing the stronger arm.'}

      {id:'lower', name:'Lower', focus:'Strength focus', rest:false, exercises:[

        {n:'Standing Calf Raise', t:'Static Stretch (30s)', w:'1-2', s:2, r:'6-8', e:'~8-9', l:'10', rest:'1-2 min', s1:'Seated Calf Raise', s2:'Leg Press Calf Press', note:'1-2 second pause at the bottom of each rep. Think about rolling your ankle back and forth on the balls of your feet.'},
        {n:'Cable Crunch', t:'Failure', w:'1', s:2, r:'8-10', e:'~8-9', l:'10', rest:'1-2 min', s1:'Decline Weighted Crunch', s2:'Machine Crunch', note:'Round your lower back as you crunch. Maintain a mind-muscle connection with your abs.'}
      ]},
      {id:'restA', name:'Rest', focus:'Rest day', rest:true, exercises:[]},
      {id:'pull', name:'Pull', focus:'Hypertrophy focus', rest:false, exercises:[
        {n:'Neutral-Grip Lat Pulldown', t:'Failure', w:'2-3', s:2, r:'8-10', e:'~8-9', l:'10', rest:'2-3 min', s1:'Neutral-Grip Pull-Up', s2:'Dual-Handle Lat Pulldown', note:'Do these with the handle more out in front, more like a cross between a pullover and a pulldown. Focus on feeling your lats rather than the weight.'},
        {n:'Chest-Supported Machine Row', t:'Failure', w:'2-3', s:3, r:'8-10', e:'~8-9', l:'10', rest:'2-3 min', s1:'Chest-Supported T-Bar Row', s2:'Incline Chest-Supported DB Row', note:'Flare elbows out at roughly 45° and squeeze your shoulder blades together hard at the top of each rep.'},
        {n:'Neutral-Grip Seated Cable Row', t:'Failure + LLPs (Extend set)', w:'1-2', s:2, r:'10-12', e:'~8-9', l:'10', rest:'2-3 min', s1:'Helms Row', s2:'Meadows Row', note:'Focus on squeezing your shoulder blades together, driving your elbows down and back.'},
        {n:'1-Arm 45° Cable Rear Delt Flye', t:'Myo-reps', w:'1-2', s:2, r:'10-12', e:'~8-9', l:'10', rest:'1-2 min', s1:'Rope Face Pull', s2:'Reverse Pec Deck', note:'Pause for 1-2 seconds in the squeeze of each rep. Contract your rear delts hard!'},
        {n:'Machine Shrug', t:'Failure', w:'2-3', s:2, r:'10-12', e:'~8-9', l:'10', rest:'1-2 min', s1:'Cable Paused Shrug-In', s2:'DB Shrug', note:'Brief pause at the top and bottom of ROM. Think about pulling your shoulders up to your ears!'},
        {n:'EZ-Bar Cable Curl', t:'Failure', w:'1', s:2, r:'10-12', e:'~8-9', l:'10', rest:'1-2 min', s1:'EZ-Bar Curl', s2:'DB Curl', note:'Set up the cable at the lowest position. Maintain constant tension on the biceps. Slow, controlled reps!'},
        {n:'Machine Preacher Curl', t:'Myo-reps', w:'1', s:1, r:'12-15', e:'N/A', l:'10', rest:'1-2 min', s1:'EZ-Bar Preacher Curl', s2:'DB Preacher Curl', note:'Smooth, controlled reps. Mind-muscle connection with the biceps.'}

        {n:'High-Cable Lateral Raise', t:'Myo-reps', w:'1', s:2, r:'10-12', e:'~8-9', l:'10', rest:'1-2 min', s1:'High-Cable Cuffed Lateral Raise', s2:'Lean-In DB Lateral Raise', note:'Focus on squeezing your lateral delt to move the weight.'},
        {n:'Overhead Cable Triceps Extension (Bar)', t:'Failure', w:'1', s:2, r:'10-12', e:'~8-9', l:'10', rest:'1-2 min', s1:'Overhead Cable Triceps Extension (Rope)', s2:'DB Skull Crusher', note:'Optionally pause for 0.5-1 second in the stretched aspect of each rep.'},

      {id:'legs', name:'Legs', focus:'Hypertrophy focus', rest:false, exercises:[

        {n:'Standing Calf Raise', t:'Static Stretch (30s)', w:'1-2', s:2, r:'10-12', e:'~8-9', l:'10', rest:'1-2 min', s1:'Seated Calf Raise', s2:'Leg Press Calf Press', note:'1-2 second pause at the bottom of each rep. Think about rolling your ankle back and forth on the balls of your feet.'}
      ]},
      {id:'restB', name:'Rest', focus:'Rest day', rest:true, exercises:[]}
    ]
  },
  {
    id:'B', label:'Weeks 6-12',

BLOCKS.forEach(block=>{
  block.days.forEach(day=>{
    day.exercises.forEach((ex,i)=>{ ex.id = block.id+'-'+day.id+'-'+i; });
  });
});

function blockForWeek(week){
  return (week>=6) ? BLOCKS.find(b=>b.id==='B') : BLOCKS.find(b=>b.id==='A');
}

const hasStorage = !!(window.storage);
let currentWeek = 1;
let currentBlock = blockForWeek(currentWeek);
let currentDayId = currentBlock.days.find(d=>!d.rest).id;
let currentDate = todayStr();
let sessionData = {};
let prevSessionInfo = null;
let openDetails = {};

function todayStr(){
  const d = new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+mm+'-'+dd;
}

function fmtDate(dateStr){
  const [y,m,d] = dateStr.split('-');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(m,10)-1]+' '+parseInt(d,10);
}

async function safeGet(key){
  if(!hasStorage) return null;
  try{ return await window.storage.get(key); }catch(e){ return null; }
}
async function safeSet(key,value){
  if(!hasStorage) return null;
  try{ return await window.storage.set(key, value); }catch(e){ console.error('storage set failed',e); return null; }
}

async function loadDates(blockId,dayId){
  const res = await safeGet('dates:'+blockId+':'+dayId);
  if(!res) return [];
  try{ return JSON.parse(res.value); }catch(e){ return []; }
}
async function saveDates(blockId,dayId, arr){
  await safeSet('dates:'+blockId+':'+dayId, JSON.stringify(arr));
}
async function loadSession(blockId,dayId,date){
  const res = await safeGet('session:'+blockId+':'+dayId+':'+date);
  if(!res) return {};
  try{ return JSON.parse(res.value); }catch(e){ return {}; }
}
async function saveSession(blockId,dayId,date,data){
  await safeSet('session:'+blockId+':'+dayId+':'+date, JSON.stringify(data));
  const dates = await loadDates(blockId,dayId);
  if(!dates.includes(date)){
    dates.push(date);
    dates.sort();
    await saveDates(blockId,dayId,dates);
  }
}
async function findPrevSession(blockId,dayId,date){
  const dates = await loadDates(blockId,dayId);
  const priorDates = dates.filter(d=>d<date);
  if(priorDates.length===0) return null;
  const prior = priorDates[priorDates.length-1];
  const data = await loadSession(blockId,dayId,prior);
  return {date:prior, data};
}

function getSets(record){
  if(!record) return [];
  return Array.isArray(record) ? record : (record.sets || []);
}
function getVariant(record){
  if(!record) return 'main';
  return Array.isArray(record) ? 'main' : (record.variant || 'main');
}
function getExtra(record){
  if(!record || Array.isArray(record)) return 0;
  return record.extra || 0;
}
function variantName(ex,variant){
  if(variant==='sub1') return ex.s1;
  if(variant==='sub2') return ex.s2;
  return ex.n;
}

async function loadWeekPref(){
  const res = await safeGet('meta:week');
  if(!res) return null;
  try{ return JSON.parse(res.value); }catch(e){ return null; }
}
async function saveWeekPref(week){
  await safeSet('meta:week', JSON.stringify(week));
}

function renderTabs(){
  const nav = document.getElementById('dayTabs');
  nav.innerHTML = '';
  currentBlock.days.forEach(day=>{
    const tab = document.createElement('div');
    tab.className = 'tab'+(day.id===currentDayId?' active':'')+(day.rest?' rest':'');
    tab.innerHTML = day.name+'<span class="sub">'+(day.rest?'':day.focus)+'</span>';
    tab.addEventListener('click', ()=>{ currentDayId = day.id; renderDay(); });
    nav.appendChild(tab);
  });
}

async function renderDay(){
  document.getElementById('blockTag').textContent = 'Block '+currentBlock.id+' · '+currentBlock.label;
  renderTabs();
  const day = currentBlock.days.find(d=>d.id===currentDayId);
  const content = document.getElementById('dayContent');

  if(day.rest){
    content.innerHTML = '<div class="rest-message">Rest day — no exercises programmed</div>';
    updateProgressBadge(0,0);
    return;
  }

  sessionData = await loadSession(currentBlock.id, day.id, currentDate);
  prevSessionInfo = await findPrevSession(currentBlock.id, day.id, currentDate);

  let html = '<div class="day-heading"><h2>'+day.name+'</h2><span class="focus">'+day.focus+'</span></div>';

  day.exercises.forEach(ex=>{
    const record = sessionData[ex.id];
    const loggedSets = getSets(record);
    const variant = getVariant(record);
    const prevRecord = prevSessionInfo && prevSessionInfo.data[ex.id];
    const prevSets = getSets(prevRecord);
    const isOpen = !!openDetails[ex.id];
    const displayName = variantName(ex,variant);

    let rpeTxt = ex.e==='N/A' ? 'N/A' : (ex.e+' → '+ex.l);

    html += '<div class="exercise" data-ex="'+ex.id+'">';
    html += '  <div class="ex-head" data-toggle="'+ex.id+'">';
    html += '    <div>';
    html += '      <p class="ex-name">'+displayName+(variant!=='main' ? ' <span class="sub-flag">(substitution)</span>' : '')+'</p>';
    html += '      <p class="ex-target">'+ex.s+' × '+ex.r+' &nbsp;·&nbsp; RPE <span class="rpe">'+rpeTxt+'</span> &nbsp;·&nbsp; rest '+ex.rest+'</p>';
    html += '    </div>';
    html += '    <div class="ex-toggle">'+(isOpen?'Hide details':'Details')+'</div>';
    html += '  </div>';

    html += '  <div class="ex-details'+(isOpen?' open':'')+'" id="details-'+ex.id+'">';
    html += '    <div class="row"><b>Technique:</b> '+ex.t+'</div>';
    html += '    <div class="row"><b>Warm-up sets:</b> '+ex.w+'</div>';
    html += '    <div class="row"><b>Notes:</b> '+ex.note+'</div>';
    html += '  </div>';

    html += '  <p class="variant-label">Exercise performed</p>';
    html += '  <div class="variant-row">';
    html += '    <button type="button" class="variant-chip'+(variant==='main'?' active':'')+'" data-ex="'+ex.id+'" data-variant="main">'+ex.n+'</button>';
    html += '    <button type="button" class="variant-chip'+(variant==='sub1'?' active':'')+'" data-ex="'+ex.id+'" data-variant="sub1">'+ex.s1+'</button>';
    html += '    <button type="button" class="variant-chip'+(variant==='sub2'?' active':'')+'" data-ex="'+ex.id+'" data-variant="sub2">'+ex.s2+'</button>';
    html += '  </div>';

    html += '  <div class="field-labels"><span></span><span>Weight</span><span>Reps</span><span></span></div>';
    html += '  <div class="sets">';
    const extra = getExtra(record);
    const totalSets = ex.s + extra;
    for(let i=0;i<totalSets;i++){
      const cur = loggedSets[i] || {weight:'',reps:''};
      const prev = prevSets[i];
      const hint = prev ? (prev.weight+' × '+prev.reps) : '—';
      let upClass = '';
      if(prev && cur.weight && parseFloat(cur.weight) > parseFloat(prev.weight)) upClass = 'up';
      const logged = (cur.weight!=='' && cur.reps!=='') ? ' logged' : '';
      const isExtra = i>=ex.s;
      html += '<div class="set-row">';
      html += '  <span class="set-label">Set '+(i+1)+(isExtra?' <span class="sub-flag">extra</span>':'')+'</span>';
      html += '  <input type="number" inputmode="decimal" placeholder="'+(prev?prev.weight:'lbs')+'" value="'+cur.weight+'" class="'+logged.trim()+'" data-ex="'+ex.id+'" data-set="'+i+'" data-field="weight">';
      html += '  <input type="number" inputmode="numeric" placeholder="'+(prev?prev.reps:'reps')+'" value="'+cur.reps+'" class="'+logged.trim()+'" data-ex="'+ex.id+'" data-set="'+i+'" data-field="reps">';
      if(isExtra && i===totalSets-1){
        html += '  <button type="button" class="remove-set-btn" data-ex="'+ex.id+'">remove</button>';
      }else{
        html += '  <span class="set-hint">last: <span class="'+upClass+'">'+hint+'</span></span>';
      }
      html += '</div>';
    }
    html += '  </div>';
    html += '  <button type="button" class="add-set-btn" data-ex="'+ex.id+'">+ Add set</button>';
    html += '</div>';
  });

  content.innerHTML = html;

  content.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-toggle');
      openDetails[id] = !openDetails[id];
      renderDay();
    });
  });

  content.querySelectorAll('input[data-field]').forEach(inp=>{
    inp.addEventListener('click', e=>e.stopPropagation());
    inp.addEventListener('change', onSetInputChange);
  });

  content.querySelectorAll('.variant-chip').forEach(chip=>{
    chip.addEventListener('click', e=>{ e.stopPropagation(); onVariantChange(chip); });
  });

  content.querySelectorAll('.add-set-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{ e.stopPropagation(); onAddSet(btn.getAttribute('data-ex')); });
  });

  content.querySelectorAll('.remove-set-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      onRemoveSet(btn.getAttribute('data-ex'));
    });
  });

  updateProgressBadgeFor(day);
}

function ensureRecord(exId){
  if(!sessionData[exId] || Array.isArray(sessionData[exId])){
    sessionData[exId] = {variant:'main', extra:0, sets: getSets(sessionData[exId])};
  }
  if(sessionData[exId].extra === undefined) sessionData[exId].extra = 0;
  return sessionData[exId];
}

async function onSetInputChange(e){
  const exId = e.target.getAttribute('data-ex');
  const setIdx = parseInt(e.target.getAttribute('data-set'),10);
  const field = e.target.getAttribute('data-field');
  const value = e.target.value;

  const record = ensureRecord(exId);
  while(record.sets.length <= setIdx) record.sets.push({weight:'',reps:''});
  record.sets[setIdx][field] = value;

  const day = currentBlock.days.find(d=>d.id===currentDayId);
  await saveSession(currentBlock.id, day.id, currentDate, sessionData);

  const set = record.sets[setIdx];
  const row = e.target.closest('.set-row');
  const bothFilled = set.weight!=='' && set.reps!=='';
  row.querySelectorAll('input').forEach(i=>i.classList.toggle('logged', bothFilled));

  updateProgressBadgeFor(day);
}

async function onVariantChange(chip){
  const exId = chip.getAttribute('data-ex');
  const variant = chip.getAttribute('data-variant');

  const record = ensureRecord(exId);
  record.variant = variant;

  const day = currentBlock.days.find(d=>d.id===currentDayId);
  await saveSession(currentBlock.id, day.id, currentDate, sessionData);

  renderDay();
}

async function onAddSet(exId){
  const record = ensureRecord(exId);
  record.extra = (record.extra||0) + 1;

  const day = currentBlock.days.find(d=>d.id===currentDayId);
  await saveSession(currentBlock.id, day.id, currentDate, sessionData);

  renderDay();
}

async function onRemoveSet(exId){
  const record = ensureRecord(exId);
  if(record.extra > 0){
    record.extra -= 1;
    const day = currentBlock.days.find(d=>d.id===currentDayId);
    const ex = day.exercises.find(x=>x.id===exId);
    const newTotal = ex.s + record.extra;
    if(record.sets.length > newTotal) record.sets = record.sets.slice(0, newTotal);
    await saveSession(currentBlock.id, day.id, currentDate, sessionData);
  }

  renderDay();
}

function updateProgressBadge(logged,total){
  const badge = document.getElementById('progressBadge');
  badge.textContent = logged+' / '+total+' logged';
  badge.classList.toggle('full', total>0 && logged===total);
}
function updateProgressBadgeFor(day){
  const total = day.exercises.length;
  let logged = 0;
  day.exercises.forEach(ex=>{
    const sets = getSets(sessionData[ex.id]);
    if(sets.some(s=>s.weight!=='' && s.reps!=='')) logged++;
  });
  updateProgressBadge(logged,total);
}

document.getElementById('dateInput').value = currentDate;
document.getElementById('dateInput').addEventListener('change', e=>{
  currentDate = e.target.value || todayStr();
  renderDay();
});
document.getElementById('todayBtn').addEventListener('click', ()=>{
  currentDate = todayStr();
  document.getElementById('dateInput').value = currentDate;
  renderDay();
});

const weekInputEl = document.getElementById('weekInput');
weekInputEl.addEventListener('change', async ()=>{
  let week = parseInt(weekInputEl.value,10);
  if(isNaN(week) || week<1) week = 1;
  if(week>12) week = 12;
  weekInputEl.value = week;
  currentWeek = week;
  currentBlock = blockForWeek(currentWeek);
  if(!currentBlock.days.some(d=>d.id===currentDayId)){
    currentDayId = currentBlock.days.find(d=>!d.rest).id;
  }
  await saveWeekPref(currentWeek);
  renderDay();
});

  historyOpen = !historyOpen;
  if(historyOpen){
    dayTabsEl.style.display = 'none';
    dayContentEl.style.display = 'none';
    historyView.style.display = 'block';
    historyToggleBtn.textContent = 'Back to log';
    populateHistBlockSelect();
  }else{
    dayTabsEl.style.display = '';
    dayContentEl.style.display = '';
    historyView.style.display = 'none';
    historyToggleBtn.textContent = 'History';
  }
});

function populateHistBlockSelect(){
  histBlockSelect.innerHTML = BLOCKS.map(b=>'<option value="'+b.id+'">Block '+b.id+' · '+b.label+'</option>').join('');
  histBlockSelect.value = currentBlock.id;
  populateHistDaySelect();
}

function populateHistDaySelect(){
  const block = BLOCKS.find(b=>b.id===histBlockSelect.value);
  const trainingDays = block.days.filter(d=>!d.rest);
  histDaySelect.innerHTML = trainingDays.map(d=>'<option value="'+d.id+'">'+d.name+' · '+d.focus+'</option>').join('');
  if(trainingDays.some(d=>d.id===currentDayId)){
    histDaySelect.value = currentDayId;
  }
  populateHistExerciseSelect();
}

function populateHistExerciseSelect(){
  const block = BLOCKS.find(b=>b.id===histBlockSelect.value);
  const day = block.days.find(d=>d.id===histDaySelect.value);
  histExerciseSelect.innerHTML = day.exercises.map(ex=>'<option value="'+ex.id+'">'+ex.n+'</option>').join('');
  renderHistory();
}

histBlockSelect.addEventListener('change', populateHistDaySelect);
histDaySelect.addEventListener('change', populateHistExerciseSelect);
histExerciseSelect.addEventListener('change', renderHistory);

async function renderHistory(){
  const blockId = histBlockSelect.value;
  const dayId = histDaySelect.value;
  const exId = histExerciseSelect.value;
  const container = document.getElementById('historyContent');
  if(!exId){ container.innerHTML = ''; return; }

  const block = BLOCKS.find(b=>b.id===blockId);
  const day = block.days.find(d=>d.id===dayId);
  const ex = day.exercises.find(e=>e.id===exId);

  const dates = await loadDates(blockId, dayId);
  const groups = {main:[], sub1:[], sub2:[]};
  for(const date of dates){
    const session = await loadSession(blockId, dayId, date);
    const record = session[exId];
    const sets = getSets(record).filter(s=>s.weight!=='' || s.reps!=='');
    if(sets.length>0){
      const variant = getVariant(record);
      groups[variant].push({date, sets:getSets(record)});
    }
  }

  const order = ['main','sub1','sub2'];
  const nonEmpty = order.filter(v=>groups[v].length>0);

  if(nonEmpty.length===0){
    container.innerHTML = '<div class="history-empty">No logged sessions yet for this exercise.</div>';
    return;
  }

  let html = '';
  nonEmpty.forEach(variant=>{
    const label = variantName(ex,variant) + (variant!=='main' ? ' <span class="sub-flag">(substitution)</span>' : '');
    html += '<h3 class="history-group-title">'+label+'</h3>';
    html += buildHistoryChart(groups[variant]) + buildHistoryTable(groups[variant]);
  });
  container.innerHTML = html;
}

function buildHistoryChart(entries){
  const points = entries
    .map((en,i)=>({i, w: parseFloat((en.sets[0]||{}).weight)}))
    .filter(p=>!isNaN(p.w));
  if(points.length===0) return '';

  const width = Math.max(360, entries.length*70);
  const height = 160;
  const padL = 36, padR = 20, padT = 20, padB = 30;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;

  const minW = Math.min(...points.map(p=>p.w));
  const maxW = Math.max(...points.map(p=>p.w));
  const range = (maxW - minW) || 1;

  const xFor = i => padL + (entries.length<=1 ? plotW/2 : (i/(entries.length-1))*plotW);
  const yFor = w => padT + plotH - ((w - minW)/range)*plotH;

  const linePath = points.map((p,idx)=>(idx===0?'M':'L')+xFor(p.i)+','+yFor(p.w)).join(' ');

  let svg = '<div class="history-chart"><svg viewBox="0 0 '+width+' '+height+'" width="'+width+'" height="'+height+'">';
  svg += '<path class="line" d="'+linePath+'"/>';
  points.forEach(p=>{
    const x = xFor(p.i), y = yFor(p.w);
    svg += '<circle class="point" cx="'+x+'" cy="'+y+'" r="3.5"/>';
    svg += '<text class="value-label" x="'+x+'" y="'+(y-8)+'" text-anchor="middle">'+p.w+'</text>';
  });
  entries.forEach((en,i)=>{
    svg += '<text class="axis-label" x="'+xFor(i)+'" y="'+(height-8)+'" text-anchor="middle">'+fmtDate(en.date)+'</text>';
  });
  svg += '</svg></div>';
  return svg;
}

function buildHistoryTable(entries){
  const maxSets = Math.max(...entries.map(en=>en.sets.length));
  let html = '<table class="history-table"><thead><tr><th>Date</th>';
  for(let i=0;i<maxSets;i++) html += '<th>Set '+(i+1)+'</th>';
  html += '</tr></thead><tbody>';
  entries.forEach(en=>{
    html += '<tr><td>'+fmtDate(en.date)+'</td>';
    for(let i=0;i<maxSets;i++){
      const s = en.sets[i];
      html += '<td>'+(s && (s.weight!=='' || s.reps!=='') ? (s.weight||'—')+' × '+(s.reps||'—') : '—')+'</td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

if(!hasStorage){
  const warn = document.createElement('div');
  warn.style.cssText = 'background:#3A2020;color:#F2A0A0;padding:10px 20px;font-size:12px;font-family:JetBrains Mono, monospace;';
  warn.textContent = 'Storage unavailable in this preview — logged sets will not be saved between sessions.';
  document.body.insertBefore(warn, document.getElementById('app'));
}

(async function init(){
  const savedWeek = await loadWeekPref();
  if(savedWeek && savedWeek>=1 && savedWeek<=12){
    currentWeek = savedWeek;
    currentBlock = blockForWeek(currentWeek);
    currentDayId = currentBlock.days.find(d=>!d.rest).id;
  }
  weekInputEl.value = currentWeek;
  renderDay();
})();
</script>
