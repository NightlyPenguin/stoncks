<!DOCTYPE html>
<html lang="screaming">
<head>
    <meta charset="UTF-8">
    <title>THE SCREAM</title>
    <style>
        :root {
            --aggressive-white: #ffffff;
            --vibrant-green: #ccff00;
            --deep-red: #ff003c;
            --shrink-speed: 0.05s;
        }

        body {
            background-color: var(--deep-red);
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden; /* To contain the madness */
            font-family: 'Didot', 'Bodoni MT', 'Times New Roman', serif; /* The fancy shouting font */
            cursor: none; /* Hide the normal cursor so we can reinvent it */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* THE TEXT WALL */
        .text-wall {
            position: relative;
            z-index: 2;
            text-align: center;
            mix-blend-mode: hard-light;
        }

        h1 {
            font-size: 12vw;
            line-height: 0.8;
            color: var(--aggressive-white);
            text-transform: uppercase;
            letter-spacing: -0.1em;
            animation: breathe 4s ease-in-out infinite;
        }

        /* THE SUBTEXT: The yammering */
        .subtext {
            position: absolute;
            bottom: 10%;
            left: 10%;
            font-family: 'Verdana', sans-serif;
            font-size: 1.5rem;
            color: var(--vibrant-green);
            text-transform: lowercase;
            line-height: 1.2;
            text-align: left;
            max-width: 40vw;
        }

        /* THE OVERLAY: Glaring in your face */
        .glare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 50%, rgba(255,255,255,0.1) 50%);
            background-size: 200% 200%;
            animation: pan 10s linear infinite;
            z-index: 10;
            pointer-events: none;
        }

        /* ANIMATIONS */
        @keyframes breathe {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes pan {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* THE INTERACTIVE ELEMENT */
        .ghost-text {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            font-size: 20rem;
            color: var(--aggressive-white);
            opacity: 0.3;
            z-index: 5;
            user-select: none;
            mix-blend-mode: exclusion;
        }

        /* MOBILE FIX */
        @media (max-width: 768px) {
            h1 { font-size: 20vw; }
            .subtext { font-size: 1rem; left: 5%; width: 90%; }
        }
    </style>
</head>
<body>

    <div class="glare"></div>
    
    <!-- The giant whisper -->
    <div class="ghost-text" id="ghost">SUBTEXT</div>

    <div class="text-wall">
        <h1>Is It<br>Enough?</h1>
        
        <div class="subtext" id="yammer">
            panning the gradient... checking the pixels... 
            is the serif font heavy enough? the green is too bright, 
            isn't it? welcome to the glitch, welcome to the 
            <span id="highlight">overload</span>.</div>
    </div>

    <script>
        const yammer = document.getElementById('yammer');
        const highlight = document.getElementById('highlight');
        const ghost = document.getElementById('ghost');
        const body = document.body;

        // 1. THE HYPER-LINKED HYPERTEXT
        // Every 1.5 seconds, pick a random letter and make it huge
        setInterval(() => {
            const letters = yammer.innerText.split('');
            const randomLetter = letters[Math.floor(Math.random() * letters.length)];
            
            const span = document.createElement('span');
            span.innerText = randomLetter;
            span.style.fontSize = Math.random() > 0.5 ? '2rem' : '0.8rem';
            span.style.color = Math.random() > 0.5 ? 'var(--aggressive-white)' : 'var(--vibrant-green)';
            
            yammer.appendChild(span);
        }, 1500);

        // 2. THE GHOST CURSOR
        // A giant, slow-moving word that you can barely see
        const words = ["CHROME", "FIREFOX", "SARCASTIC", "VOID"];
        
        function cycleWords() {
            ghost.innerText = words[Math.floor(Math.random() * words.length)];
            ghost.style.left = `${Math.random() * 50 - 25}%`;
            ghost.style.top = `${Math.random() * 50 - 25}%`;
            ghost.style.opacity = Math.random() > 0.8 ? 0.8 : 0.2;
        }

        setInterval(cycleWords, 400);
        cycleWords(); // Initial pop

        // 3. THE "SCROLL" TRICK
        // Even if you don't scroll, let's make it feel like it
        window.addEventListener('wheel', (e) => {
            const speed = e.deltaY * 2;
            yammer.style.transform = `translateY(${speed}px)`;
            body.style.filter = `blur(${speed * 0.01}px)`;
            
            setTimeout(() => {
                yammer.style.transform = `translateY(0px)`;
                body.style.filter = `blur(0px)`;
            }, 50);
        });

        // 4. THE SLOW-ZOOM
        // Just to make you feel claustrophobic
        setTimeout(() => {
            document.querySelector('.text-wall').style.transform = "scale(1.1)";
        }, 3000);

    </script>
</body>
</html>
